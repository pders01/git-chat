name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Go vet and test
        run: make check

      - name: Build binary
        run: make all

      - name: Proto freshness
        run: |
          make proto
          git diff --exit-code gen/ || {
            echo "Generated Go code is stale — run 'make proto' locally and commit"
            exit 1
          }
